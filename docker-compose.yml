version: '3.8'

services:
  postgres-order:
    image: postgres:15
    container_name: order-postgres
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 565452
    ports:
      - "5432:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - order-network

  postgres-user:
    image: postgres:15
    container_name: user-postgres
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - order-network

  user-service:
    image: userservice-app:latest
    container_name: user-service
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/user_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
    ports:
      - "8080:8080"
    depends_on:
      postgres-user:
        condition: service_healthy
    networks:
      - order-network
    restart: on-failure

  order-service:
    build: .
    container_name: order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/orderdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 565452
      SERVER_PORT: 8081
      USER_SERVICE_URL: http://user-service:8080
    ports:
      - "8081:8081"
    depends_on:
      postgres-order:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - order-network
    restart: on-failure

  redis:
    image: redis:7-alpine
    container_name: order-redis
    ports:
      - "6379:6379"
    networks:
      - order-network
    restart: on-failure

networks:
  order-network:
    driver: bridge

volumes:
  postgres_order_data:
  postgres_user_data: